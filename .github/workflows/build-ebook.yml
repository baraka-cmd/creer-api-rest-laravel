name: Build ebook PDF and EPUB

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - publication/ebook-layout
    paths:
      - "_quarto.yml"
      - "ebook.css"
      - "manuscript/**"
      - ".github/workflows/build-ebook.yml"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout manuscript
        uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Poppins from official Google Fonts files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core fontconfig curl
          mkdir -p "$HOME/.local/share/fonts/Poppins"
          FONT_DIR="$HOME/.local/share/fonts/Poppins"
          BASE="https://raw.githubusercontent.com/google/fonts/main/ofl/poppins"
          for font in Poppins-Regular.ttf Poppins-Bold.ttf Poppins-Italic.ttf Poppins-BoldItalic.ttf; do
            curl --fail --location --silent --show-error "$BASE/$font" --output "$FONT_DIR/$font"
            test -s "$FONT_DIR/$font"
            file "$FONT_DIR/$font"
          done
          curl --fail --location --silent --show-error "$BASE/OFL.txt" --output "$FONT_DIR/OFL.txt"
          fc-cache --force
          fc-match Poppins

      - name: Install TinyTeX
        run: quarto install tinytex

      - name: Build PDF
        run: quarto render --to pdf

      - name: Build EPUB
        run: quarto render --to epub

      - name: Upload publication files
        uses: actions/upload-artifact@v4
        with:
          name: ebook-pdf-epub
          path: |
            _book/*.pdf
            _book/*.epub
          if-no-files-found: error
          retention-days: 14
